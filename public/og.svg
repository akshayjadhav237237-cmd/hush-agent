<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Dark navy radial glow -->
    <radialGradient id="ogGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#0a1f44" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#061226" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle green halo for asterisk -->
    <radialGradient id="asteriskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22FF6E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22FF6E" stop-opacity="0"/>
    </radialGradient>

    <!-- Minimalist subtle grid pattern -->
    <pattern id="ogGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>

    <!-- Grid edge falloff mask -->
    <radialGradient id="gridMaskGradient" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridMaskGradient)"/>
    </mask>

    <style>
      .wordmark {
        font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 130px;
        font-weight: 800;
        fill: #F5F0E8;
        letter-spacing: -1.5px;
      }
      .tagline {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 400;
        fill: #C9C5BD;
        letter-spacing: -0.3px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', 'Geist Mono', 'Consolas', monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #989EAA;
        letter-spacing: 0.2px;
      }
      .badge-bold {
        fill: #F5F0E8;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Base Black Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Radial Glow #0a1f44 -->
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Clean Minimalist Grid -->
  <rect width="1200" height="630" fill="url(#ogGrid)" mask="url(#gridMask)"/>

  <!-- Subtle Asterisk Green Glow -->
  <circle cx="786" cy="188" r="90" fill="url(#asteriskGlow)"/>

  <!-- Giant Wordmark: HUSH + Green Asterisk -->
  <g id="brand-group">
    <text x="568" y="254" text-anchor="middle" class="wordmark">HUSH</text>
    <!-- Signature 8-point green asterisk -->
    <g transform="translate(786, 188)">
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#22FF6E" stroke-width="5" stroke-linecap="round"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#22FF6E" stroke-width="5" stroke-linecap="round"/>
      <line x1="-16.97" y1="-16.97" x2="16.97" y2="16.97" stroke="#22FF6E" stroke-width="5" stroke-linecap="round"/>
      <line x1="-16.97" y1="16.97" x2="16.97" y2="-16.97" stroke="#22FF6E" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="600" y="336" text-anchor="middle" class="tagline">Builds quietly. Speaks only when it must.</text>

  <!-- Bottom Badge: Autonomous Windows Desktop Orchestrator • Built with Google Gemma 4 -->
  <g transform="translate(255, 420)">
    <rect width="690" height="46" rx="23" fill="#0C0E14" stroke="#252A36" stroke-width="1.2"/>
    <!-- Glowing green dot -->
    <circle cx="27" cy="23" r="8" fill="#22FF6E" fill-opacity="0.25"/>
    <circle cx="27" cy="23" r="4" fill="#22FF6E"/>
    <!-- Badge text -->
    <text x="46" y="28.5" class="badge-text">Autonomous Windows Desktop Orchestrator <tspan fill="#4E5564">•</tspan> Built with <tspan class="badge-bold">Google Gemma 4</tspan></text>
  </g>
</svg>
