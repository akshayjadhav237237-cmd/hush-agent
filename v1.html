    <link rel="canonical" href="https://akshayjadhav237237-cmd.github.io/hush-agent/v1.html" />
    <script>
      (function () {
        try {
          if (window.location.hostname && !window.location.hostname.includes('github.io')) {
            var c = document.querySelector('link[rel="canonical"]');
            if (c) c.setAttribute('href', window.location.origin + window.location.pathname);
            var og = document.querySelector('meta[property="og:url"]');
            if (og) og.setAttribute('content', window.location.origin + window.location.pathname);
          }
        } catch (_) {}
      })();
    </script>
